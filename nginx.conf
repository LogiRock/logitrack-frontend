server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # DNS interno de Docker: resuelve "api-gateway" en cada request,
    # así Nginx no se queda con una IP vieja si el gateway se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Todo lo que empiece con /application va al gateway por la red interna.
    # Sin URI en proxy_pass: el path llega completo (/application/...).
    location /application/ {
        set $gateway http://api-gateway:8066;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se vea al instante
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rutas de React Router (/envios, /repartidores, ...): siempre index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
